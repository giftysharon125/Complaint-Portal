<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complaints — Admin — Complaint Portal</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/dashboard.css"/>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div id="topbar-slot"></div>
      <div class="content" id="admin-complaints-root">
        <div class="flex-between mb-2">
          <div>
            <h2>Complaint Management</h2>
            <p>Search, filter, assign and update every complaint.</p>
          </div>
          <span class="text-muted" id="ac-count">0 complaints</span>
        </div>

        <div class="filter-bar">
          <input type="search" id="f-search" placeholder="Search by ID, title or student..." style="min-width:220px"/>
          <select id="f-category"><option value="">All categories</option></select>
          <select id="f-priority">
            <option value="">All priorities</option>
            <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
          </select>
          <select id="f-status">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="inprogress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="rejected">Rejected</option>
            <option>Submitted</option><option>Under Review</option><option>Assigned</option>
            <option>In Progress</option><option>Resolved</option><option>Closed</option><option>Rejected</option>
          </select>
          <input type="date" id="f-from" title="From date"/>
          <input type="date" id="f-to" title="To date"/>
          <select id="f-sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
          <button class="btn btn-outline btn-sm" id="f-reset">Reset</button>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Complaint ID</th><th>Student</th><th>Title</th><th>Category</th>
                <th>Priority</th><th>Status</th><th>Submitted</th><th>Assigned Staff</th><th>Action</th>
              </tr>
            </thead>
            <tbody id="admin-complaints-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>

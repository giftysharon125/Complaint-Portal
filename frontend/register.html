<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Complaint Portal</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/forms.css"/>
</head>
<body class="auth-body">
  <div class="auth-card wide">
    <div class="auth-brand">
      <i data-lucide="message-square-warning"></i>
      <span class="brand-name">Complaint Portal</span>
    </div>
    <p class="auth-sub">Create a student account</p>

    <div id="register-alert" class="alert alert-error" hidden></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" class="form-control" placeholder="e.g. Arjun Patel"/>
        <div id="reg-error-name" class="field-error"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-studentid">Student ID</label>
          <input type="text" id="reg-studentid" class="form-control" placeholder="e.g. CS2026123"/>
          <div id="reg-error-studentid" class="field-error"></div>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@college.edu"/>
          <div id="reg-error-email" class="field-error"></div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-department">Department</label>
          <select id="reg-department" class="form-control"></select>
          <div id="reg-error-department" class="field-error"></div>
        </div>
        <div class="form-group">
          <label for="reg-year">Year</label>
          <select id="reg-year" class="form-control"></select>
          <div id="reg-error-year" class="field-error"></div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters"/>
          <div id="reg-error-password" class="field-error"></div>
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat password"/>
          <div id="reg-error-confirm" class="field-error"></div>
        </div>
      </div>

      <button type="submit" id="register-btn" class="btn btn-primary btn-block mt-1">Create Account</button>
    </form>

    <div class="auth-footer">Already registered? <a href="/login.html">Login here</a></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Populate department & year dropdowns (constants live in ui.js)
    document.getElementById('reg-department').innerHTML =
      '<option value="">Select department</option>' +
      DEPARTMENTS.map((d) => `<option value="${d}">${d}</option>`).join('');
    document.getElementById('reg-year').innerHTML =
      '<option value="">Select year</option>' +
      YEARS.map((y) => `<option value="${y}">${y}</option>`).join('');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Complaint Portal</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/forms.css"/>
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <i data-lucide="message-square-warning"></i>
      <span class="brand-name">Complaint Portal</span>
    </div>
    <p class="auth-sub">Sign in to your account</p>

    <div id="login-alert" class="alert alert-error" hidden></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" class="form-control" placeholder="you@college.edu" autocomplete="email"/>
        <div id="login-error-email" class="field-error"></div>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" autocomplete="current-password"/>
        <div id="login-error-password" class="field-error"></div>
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary btn-block mt-1">Login</button>
    </form>

    <div class="auth-footer">No account? <a href="/register.html">Register as a student</a></div>

    <div class="demo-creds">
      <strong>Demo credentials (seeded data)</strong><br/>
      Admin: <code>admin@college.edu</code> / <code>admin123</code><br/>
      Staff: <code>staff1@college.edu</code> / <code>staff123</code><br/>
      Student: <code>arjun@college.edu</code> / <code>student123</code>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    refreshIcons();
    // Already logged in? go straight to the right dashboard
    const existingUser = getUser();
    if (existingUser && !new URLSearchParams(location.search).get('expired')) {
      window.location.href = redirectPathFor(existingUser.role);
    }
  </script>
</body>
</html>

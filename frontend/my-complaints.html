<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Complaints — Complaint Portal</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/dashboard.css"/>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div id="topbar-slot"></div>
      <div class="content" id="my-complaints-root">
        <div class="flex-between mb-2">
          <div>
            <h2>My Complaints</h2>
            <p><span id="my-count">0 complaints</span></p>
          </div>
          <a href="/submit-complaint.html" class="btn btn-primary"><i data-lucide="file-plus-2"></i> Submit Complaint</a>
        </div>

        <div class="filter-bar">
          <input type="search" id="my-search" placeholder="Search by title or complaint ID..."/>
          <select id="my-status">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="inprogress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="rejected">Rejected</option>
          </select>
          <select id="my-category"><option value="">All categories</option></select>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Complaint ID</th><th>Title</th><th>Category</th><th>Priority</th>
                <th>Status</th><th>Submitted</th><th></th>
              </tr>
            </thead>
            <tbody id="my-complaints-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>

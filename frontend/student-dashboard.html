<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Complaint Portal</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/dashboard.css"/>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div id="topbar-slot"></div>
      <div class="content" id="student-dashboard-root">

        <div class="flex-between mb-2">
          <div>
            <h2>Welcome back, <span id="welcome-name">Student</span> 👋</h2>
            <p>Here is an overview of your complaints.</p>
          </div>
          <a href="/submit-complaint.html" class="btn btn-primary">
            <i data-lucide="file-plus-2"></i> Submit Complaint
          </a>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-icon blue"><i data-lucide="clipboard-list"></i></div>
            <div><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total Complaints</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon amber"><i data-lucide="clock"></i></div>
            <div><div class="stat-value" id="stat-pending">0</div><div class="stat-label">Pending</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon slate"><i data-lucide="loader"></i></div>
            <div><div class="stat-value" id="stat-inprogress">0</div><div class="stat-label">In Progress</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green"><i data-lucide="check-circle-2"></i></div>
            <div><div class="stat-value" id="stat-resolved">0</div><div class="stat-label">Resolved</div></div>
          </div>
        </div>

        <div class="dash-grid">
          <div class="card">
            <div class="card-title">Recent Complaints</div>
            <div class="table-wrap">
              <table class="data-table" style="min-width:640px">
                <thead>
                  <tr>
                    <th>Complaint ID</th><th>Title</th><th>Category</th><th>Priority</th>
                    <th>Status</th><th>Date</th><th></th>
                  </tr>
                </thead>
                <tbody id="dash-complaints-body"></tbody>
              </table>
            </div>
            <div class="pill-group mt-2" id="dash-pills">
              <button class="pill active" data-filter="all">All</button>
              <button class="pill" data-filter="pending">Pending</button>
              <button class="pill" data-filter="inprogress">In Progress</button>
              <button class="pill" data-filter="resolved">Resolved</button>
              <a class="pill" href="/my-complaints.html" style="margin-left:auto;text-decoration:none">View all →</a>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Status Distribution</div>
            <div class="chart-box"><canvas id="dash-chart"></canvas></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
